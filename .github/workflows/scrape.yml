name: Update zeczec rewards

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分鐘（UTC），GitHub 可能延遲幾分鐘
  workflow_dispatch:          # 允許在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scrape
        run: python3 scripts/scrape.py
        env:
          PROJECT_SLUG: NOTHING-LEFT-BUT-COURAGE

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/rewards.json
          git diff --cached --quiet || (git commit -m "Update rewards data" && git push)
